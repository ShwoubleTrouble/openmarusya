services:
  marusya:
    build:
      context: .
      args:
        # если Docker Hub недоступен — указать зеркало в .env
        BASE_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
    container_name: marusya
    restart: unless-stopped
    network_mode: host
    environment:
      # xray слушает 127.0.0.1 на хосте — поэтому сеть хоста
      SERVER_PORT: "${HOST_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./models:/models
      - ../capsule:/srv/capsule:ro
    # whisper small на CPU int8: ~1 ГБ RAM
    mem_limit: 3g
